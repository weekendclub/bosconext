<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BOSCO NEXT">
  <title>BOSCO NEXT</title>
  <!-- ヘッダーロゴのボール（style.css の .brand .ball）をそのまま図形にしたもの。
       赤いボール／内側にゴールドのリング／左上に白いハイライト。
       色を変えるときは style.css の :root と揃えてください。 -->
  <defs>
    <clipPath id="b"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#d4202a"/>
  <circle cx="22.4" cy="19.2" r="18.3" fill="#ffffff" clip-path="url(#b)"/>
  <circle cx="32" cy="32" r="28.3" fill="none" stroke="#f4c01e" stroke-width="7.4"/>
</svg>
